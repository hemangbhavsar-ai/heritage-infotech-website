<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <!-- Force relative assets (config.yml) to resolve under /admin/ even if the URL has no trailing slash. -->
  <base href="/admin/" />
  <title>Heritage InfoTech — Content Manager</title>
</head>
<body>
  <script>
    (function () {
      var host = window.location.hostname;
      var isLocal = host === 'localhost' || host === '127.0.0.1';

      function bindIdentity() {
        if (!window.netlifyIdentity) return;
        window.netlifyIdentity.on('init', function (user) {
          var hash = window.location.hash || '';
          if (
            hash.indexOf('recovery_token') !== -1 ||
            hash.indexOf('invite_token') !== -1 ||
            hash.indexOf('confirmation_token') !== -1
          ) {
            var mode = hash.indexOf('recovery_token') !== -1
              ? 'recovery'
              : hash.indexOf('invite_token') !== -1
                ? 'signup'
                : 'login';
            window.netlifyIdentity.open(mode);
          } else if (!user) {
            window.netlifyIdentity.on('login', function () {
              document.location.href = '/admin/';
            });
          }
        });
      }

      // Local admin uses decap-server. Identity is only for published Netlify sites.
      if (!isLocal) {
        var identity = document.createElement('script');
        identity.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
        identity.onload = bindIdentity;
        document.head.appendChild(identity);
      }

      var cms = document.createElement('script');
      cms.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      document.body.appendChild(cms);
    })();
  </script>
</body>
</html>
